<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 32" fill="none">
  <style>
    .bg { fill: #1A1A1A; stroke: #E8E8E4; stroke-width: 1; }
    .mark { fill: #FFFFFF; }
    .word { fill: #1A1A1A; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #A3B18A; stroke: #8B9A7B; stroke-width: 1; }
      .mark { fill: #121210; }
      .word { fill: #F5F5F3; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="8"/>
  <text class="mark" x="16" y="22" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="18">V</text>
  <text class="word" x="42" y="23" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" letter-spacing="-0.5px">veyra</text>
</svg>
